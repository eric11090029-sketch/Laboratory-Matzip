<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>맛집탐방 기록 지도</title>
<style>
/* 레이아웃: 노란 머리띠 아래에 필터, 왼쪽에 지도와 목록, 오른쪽에 선택한 식당의 보고서. 흰 바탕 단일 테마. */
@font-face{font-family:"Otoki Sans";font-weight:500;font-display:swap;src:url("fonts/OtokiSans3N-Medium.ttf") format("truetype")}
@font-face{font-family:"Otoki Sans";font-weight:700;font-display:swap;src:url("fonts/OtokiSans3N-Bold.ttf") format("truetype")}
@font-face{font-family:"Otoki Sans";font-weight:800;font-display:swap;src:url("fonts/OtokiSans3N-ExtraBold.ttf") format("truetype")}
:root{
  color-scheme:light;
  --bg:#ffffff; --tint:#fff7cf; --ink:#1d1a12; --muted:#6b6654; --line:#e9e2c4;
  --yellow:#ffd200; --yellow-deep:#e9b800; --red:#d3001b; --map:#fcf7df; --water:#bcd8ee;
  --display:"Otoki Sans","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --body:"Otoki Sans","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500;font-size:15px;line-height:1.6}
h1,h2,h3{margin:0;text-wrap:balance}
b,strong{font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.band{background:var(--yellow)}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;justify-content:space-between;padding-top:14px;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.01em}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--muted);white-space:nowrap;background:var(--bg)}
.pill.kind{background:var(--yellow);border-color:var(--yellow);color:var(--ink);font-weight:700}
.pill.sample{border-style:dashed;border-color:var(--muted)}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.primary{background:var(--yellow);border-color:var(--yellow-deep);font-weight:700}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.btn.danger{color:var(--red)}
.btn.small{padding:4px 11px;font-size:13.5px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:16px 0 12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field label{display:block}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink);font-size:15px;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--yellow-deep)}
.field textarea{resize:vertical;min-height:64px}
.filters .field{flex:1 1 130px}
.filters .field input,.filters .field select{height:40px}
.filters .grow{flex:2 1 200px}
.summary{font-size:14px;color:var(--muted);padding-bottom:12px;font-variant-numeric:tabular-nums}
.summary b{color:var(--ink)}
.banner{background:var(--tint);border:1px solid var(--yellow-deep);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.banner.bad{background:#fff0f0;border-color:var(--red);color:var(--red)}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-areas:"map detail" "list detail";grid-template-rows:auto 1fr;gap:16px;align-items:start;padding-bottom:16px}
.mapbox{grid-area:map;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto;background:var(--map)}
.gmap{width:100%;height:460px}
.mapnote{padding:8px 12px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.dot{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:11.5px;font-weight:700;margin-right:3px;flex:none}
.list{grid-area:list;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.row:hover{border-color:var(--yellow-deep)}
.row[aria-current="true"]{background:var(--tint);border-color:var(--yellow-deep);box-shadow:inset 4px 0 0 var(--yellow)}
.row .main{flex:1;min-width:0}
.row .name{font-weight:700;overflow-wrap:anywhere}
.row .meta{font-size:13px;color:var(--muted)}
.row .score{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--red);font-weight:700}
.detail{grid-area:detail;border:1px solid var(--line);border-top:5px solid var(--yellow);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.detail h2{font-size:23px;font-weight:800;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.stars{color:var(--red);letter-spacing:1px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14.5px}
.facts dt{color:var(--muted);white-space:nowrap}
.facts dd{margin:0;overflow-wrap:anywhere}
.sec h3{font-size:14px;font-weight:700;padding-bottom:4px;border-bottom:2px solid var(--yellow);margin-bottom:8px}
.sec p{margin:0 0 8px;max-width:65ch;white-space:pre-wrap;overflow-wrap:anywhere}
.sec .lab{font-size:13px;color:var(--muted);margin-bottom:2px}
.rating{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:14.5px;padding:4px 0}
.rating .by{color:var(--muted);font-size:13px}
.starpick{display:flex;gap:2px}
.starpick button{background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:#d9d3bb;padding:2px}
.starpick button.on{color:var(--red)}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline input[type=text]{flex:1 1 160px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.files{display:flex;flex-direction:column;gap:6px;font-size:14px}
.files img{max-width:100%;border-radius:8px;border:1px solid var(--line)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.photos .ph{position:relative;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--tint);cursor:zoom-in;aspect-ratio:4/3;display:block;width:100%}
.photos .ph img{width:100%;height:100%;object-fit:cover;display:block}
.photos .ph.wait{cursor:default;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--muted)}
.photos .cell{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.lightbox{align-items:center;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:90vh;border-radius:8px;background:#fff}
.empty{color:var(--muted);padding:24px 8px;text-align:center}
a{color:var(--ink);text-decoration-color:var(--yellow-deep);text-decoration-thickness:2px;text-underline-offset:3px}
.overlay{position:fixed;inset:0;background:rgba(29,26,18,.5);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;z-index:10}
.modal{background:var(--bg);border-radius:14px;border-top:6px solid var(--yellow);padding:20px;width:100%;max-width:720px;display:flex;flex-direction:column;gap:14px}
.modal h2{font-size:20px;font-weight:800}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.hint{font-size:12.5px;color:var(--muted)}
.gatebg{min-height:100vh;background:var(--yellow);padding:8vh 16px 32px}
.gate{max-width:440px;margin:0 auto;background:var(--bg);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:14px}
.gate h1{font-family:var(--display);font-weight:800;font-size:30px}
.err{color:var(--red);font-size:13.5px}
svg text{font-family:var(--body)}
.mk{cursor:pointer}
@media (max-width:820px){
  .grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"map" "detail" "list"}
  .gmap{height:340px}
}
@media (prefers-reduced-motion:no-preference){.row,.btn{transition:border-color .15s}}
</style>
</head>

  for(var i=0;i<arr.length;i++){

  }
 }catch(e){S.err="가져오는 중 문제가 생겼습니다. "+e.message}
 S.busy=false;S.loading=false;

}

 var seq=++fbSeq;
 S.denied="";S.needTeam=false;S.gateErr="";
 if(!u){S.user=null;S.records=[];S.loading=false;if(fbUnsub){fbUnsub();fbUnsub=null}render();return}
 S.fbUid=u.uid;S.fbName=u.displayName||u.email||"사용자";
 S.loading=true;render();
 try{
  S.fbEmail=(u.email||"").toLowerCase();S.admin=false;
  var md=await fdb.collection("members").doc(S.fbEmail).get();
  if(seq!==fbSeq)return;
  if(!md.exists){S.denied=u.email||S.fbName;S.loading=false;render();return}
  S.admin=md.data().admin===true;
  var d=await fdb.collection("profiles").doc(u.uid).get();
  if(seq!==fbSeq)return;
  if(d.exists&&d.data().team){S.user={name:S.fbName,team:d.data().team};await loadRecords();return}
  S.needTeam=true;
 }catch(e){
  if(seq!==fbSeq)return;
  if(e&&e.code==="permission-denied")S.denied=u.email||S.fbName;else S.gateErr="로그인 확인 중 문제가 생겼습니다. "+(e&&e.message?e.message:e);
 }
 S.loading=false;render();
}
async function act(a,el){
 var r=S.sel?rec(S.sel):null;
 try{
 if(a==="enter"){var n=val("g-name"),t=val("g-team");if(!n||!t){S.gateErr="이름과 팀을 모두 입력해 주세요.";render();return}S.user={name:n,team:t};S.gateErr="";save(KEY_U,S.user);await loadRecords();return}
 else if(a==="glogin"){
  var prov=new firebase.auth.GoogleAuthProvider();
  try{await fauth.signInWithPopup(prov)}
  catch(e){
   if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")){await fauth.signInWithRedirect(prov);return}
   if(e&&(e.code==="auth/popup-closed-by-user"||e.code==="auth/cancelled-popup-request"))return;
   S.gateErr=e&&e.code==="auth/unauthorized-domain"?"이 주소는 Firebase 로그인 허용 목록에 없습니다. Firebase 콘솔의 Authentication > 설정 > 승인된 도메인에 이 사이트 주소를 추가해 주세요.":"로그인하지 못했습니다. "+(e&&e.message?e.message:e);
  }
  render();return;
 }
 else if(a==="team-save"){
  var tm=val("g-team");if(!tm){S.gateErr="팀 이름을 입력해 주세요.";render();return}
  await fdb.collection("profiles").doc(S.fbUid).set({name:S.fbName,team:tm});
  S.needTeam=false;S.user={name:S.fbName,team:tm};await loadRecords();return;
 }
 else if(a==="mem-open"){S.mem={list:[],err:"",loading:true};render();try{await loadMembers()}catch(e){S.mem.loading=false;S.mem.err="사용자 목록을 불러오지 못했습니다. "+e.message}}
 else if(a==="mem-close"){S.mem=null}
 else if(a==="mem-add"&&S.mem){
  var em=val("m-email").toLowerCase(),nm=val("m-name");
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)||em.indexOf("/")>=0){S.mem.err="이메일 주소를 정확히 입력해 주세요.";render();return}
  if(S.mem.list.some(function(x){return x.email===em})){S.mem.err="이미 등록된 이메일입니다.";render();return}
  S.busy=true;S.mem.err="";
  try{await fdb.collection("members").doc(em).set({name:nm,admin:false,addedBy:S.fbEmail,addedAt:new Date().toISOString()});await loadMembers()}
  catch(e){S.mem.err="추가하지 못했습니다. "+e.message}
  S.busy=false;
 }
 else if((a==="mem-del"||a==="mem-admin")&&S.mem){
  var id=el.getAttribute("data-id"),tg=null;S.mem.list.forEach(function(x){if(x.email===id)tg=x});
  if(!tg||id===S.fbEmail)return;
  S.mem.err="";
  try{
   if(a==="mem-del")await fdb.collection("members").doc(id).delete();
   else await fdb.collection("members").doc(id).set({name:tg.name,admin:!tg.admin},{merge:true});
   await loadMembers();
  }catch(e){S.mem.err="바꾸지 못했습니다. "+e.message}
 }
 else if(a==="export"){
  var out=[];
  for(var xi=0;xi<S.records.length;xi++){var x=JSON.parse(JSON.stringify(S.records[xi]));if(x.sample)continue;delete x.spId;
   for(var pi=0;pi<(x.photos||[]).length;pi++){var pp=x.photos[pi];if(!pp.data&&store.photoUrl&&pp.pid){try{pp.data=await store.photoUrl(pp)}catch(e){}}}
   out.push(x)}
  if(!out.length){S.err="내보낼 기록이 없습니다. 예시 데이터는 내보내지 않습니다.";render();return}
  saveBlob(new Blob([JSON.stringify(out)],{type:"application/json"}),"matzip-records-"+new Date().toISOString().slice(0,10)+".json");return;
 }
 else if(a==="file-get"&&r){
  var fl=r.files[Number(el.getAttribute("data-i"))];
  if(fl&&fl.fid){el.disabled=true;el.textContent="받는 중…";try{saveBlob(await FBS.fileBlob(fl),fl.name)}catch(e){S.err="파일을 받지 못했습니다. "+e.message}render()}
  return;
 }
 else if(a==="mslogin"){await msalApp.loginRedirect({scopes:SCOPES});return}
 else if(a==="logout"){if(FB){await fauth.signOut();return}if(REAL){await msalApp.logoutRedirect();return}S.user=null;try{localStorage.removeItem(KEY_U)}catch(e){}}
 else if(a==="err-close"){S.err="";S.info=""}
 else if(a==="sel"){S.sel=el.getAttribute("data-id");S.confirmDel=false;S.myStars=0}
 else if(a==="new"){S.formStars=0;S.form={isNew:true,rec:{id:"r"+Date.now()+Math.floor(Math.random()*1000),name:"",kind:"맛집탐방",cuisine:"한식",area:"성수",address:"",team:S.user.team,ym:new Date().toISOString().slice(0,7),notes:"",report:{purpose:"",menu:"",review:"",insight:""},files:[],photos:[],ratings:[]},removed:[]}}
 else if(a==="edit"&&r){S.form={isNew:false,rec:JSON.parse(JSON.stringify(r)),removed:[]}}
 else if(a==="cancel"){S.form=null}
 else if(a==="zoom"&&r){S.zoom=photoSrc(r.photos[Number(el.getAttribute("data-i"))])}
 else if(a==="zoom-close"){S.zoom=""}
 else if(a==="ph-del"&&S.form){keepForm();S.form.removed.push(S.form.rec.photos.splice(Number(el.getAttribute("data-i")),1)[0])}
 else if(a==="fstar"){S.formStars=Number(el.getAttribute("data-n"));var bs=el.parentNode.querySelectorAll("button");for(var bi=0;bi<bs.length;bi++)bs[bi].classList.toggle("on",bi<S.formStars);return}
 else if(a==="save"){
  if(S.busy)return;keepForm();var f=S.form.rec;
  if(!f.name||!f.address||!f.team||!f.ym){S.form.err="이름, 주소, 방문팀, 방문연월은 꼭 입력해 주세요.";render();return}
  if(!f.kind||!f.cuisine||!f.area){S.form.err="직접 추가를 골랐다면 새 항목 이름을 입력해 주세요.";render();return}
  var inp=document.getElementById("f-files"),picked=inp&&inp.files?Array.prototype.slice.call(inp.files):[];
  var pin=document.getElementById("f-photos"),pics=pin&&pin.files?Array.prototype.slice.call(pin.files):[];
  S.busy=true;S.form.err="";render();
  try{
   var known=findArea(f.area),sc=SIDO_C[f.sido]||[36.5,127.8];
   var ar=known||{k:f.area,sido:f.sido||"기타",lat:sc[0],lng:sc[1]};f.sido=ar.sido;
   var g=await geocode(f.address);if(!g&&!known)g=await geocode(f.sido+" "+f.area);
   var p=g||place(f.id,ar);f.lat=p.lat;f.lng=p.lng;f.sample=false;
   f.updatedBy=S.user.name;f.updatedAt=new Date().toISOString();
   if(!S.form.isNew){var cur=await store.fresh(f);f.ratings=cur.ratings||f.ratings}
   for(var i=0;i<picked.length;i++)f.files.push(await store.upload(f,picked[i]));
   for(i=0;i<pics.length;i++)f.photos.push(await store.addPhoto(f,pics[i]));
   if(S.form.isNew&&S.formStars)f.ratings.push({by:S.user.name,team:S.user.team,stars:S.formStars,comment:""});
   var before=rec(f.id),gone=S.form.removed;
   replaceRec(f);
   try{await store.save(f)}catch(e){if(before)replaceRec(before);else S.records=S.records.filter(function(x){return x.id!==f.id});throw e}
   for(i=0;i<gone.length;i++){try{await store.dropFile(gone[i])}catch(e){}}
   S.sel=f.id;S.form=null;
  }catch(e){if(S.form)S.form.err="저장하지 못했습니다. "+e.message}
  S.busy=false;
 }
 else if(a==="mystar"){S.myStars=Number(el.getAttribute("data-n"));var c=val("my-comment");render();var e2=document.getElementById("my-comment");if(e2)e2.value=c;return}
 else if(a==="rate"&&r){
  if(S.busy)return;var comment=val("my-comment"),st0=S.myStars;
  S.busy=true;
  try{
   var fr=await store.fresh(r);fr.lat=fr.lat||r.lat;fr.lng=fr.lng||r.lng;
   var mine=null;fr.ratings.forEach(function(x){if(x.by===S.user.name)mine=x});
   var st=st0||(mine?mine.stars:0);
   if(st){if(mine){mine.stars=st;mine.comment=comment}else fr.ratings.push({by:S.user.name,team:S.user.team,stars:st,comment:comment});
    replaceRec(fr);await store.save(fr);S.myStars=0}
  }catch(e){S.err="별점을 저장하지 못했습니다. "+e.message}
  S.busy=false;
 }
 else if(a==="del"){S.confirmDel=true}
 else if(a==="del-no"){S.confirmDel=false}
 else if(a==="del-yes"&&r){
  if(S.busy)return;S.busy=true;
  try{S.records=S.records.filter(function(x){return x.id!==r.id});await store.remove(r);S.sel=null}
  catch(e){S.records.push(r);S.err="삭제하지 못했습니다. "+e.message}
  S.confirmDel=false;S.busy=false;
 }
 }catch(e){S.err="문제가 생겼습니다. "+(e&&e.message?e.message:e);S.busy=false}
 render();
}
document.addEventListener("click",function(e){var el=e.target.closest("[data-act]");if(!el)return;e.preventDefault();act(el.getAttribute("data-act"),el)});
document.addEventListener("keydown",function(e){
 if(e.isComposing||e.keyCode===229)return;
 if(e.key==="Escape"&&S.mem&&!S.busy){S.mem=null;render();return}
 if(e.key==="Escape"&&S.zoom){S.zoom="";render();return}
 if(e.key==="Escape"&&S.form&&!S.busy){S.form=null;render();return}
 if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("mk")){e.preventDefault();act("sel",e.target)}
 if(e.key==="Enter"&&(e.target.id==="g-name"||e.target.id==="g-team")){act("enter",e.target)}
});
document.addEventListener("change",function(e){
 if(e.target.id==="imp-file"){var jf=e.target.files&&e.target.files[0];if(jf)importRecords(jf);return}
 if(e.target.getAttribute&&e.target.getAttribute("data-new")){
  var on=e.target.value==="__new",ni=document.getElementById(e.target.id+"-new");ni.hidden=!on;
  if(e.target.id==="f-area")document.getElementById("f-sido-new").hidden=!on;
  if(on)ni.focus();return;
 }
 var k=e.target.getAttribute&&e.target.getAttribute("data-f");if(k&&k!=="q"){S.f[k]=e.target.value;render()}});
document.addEventListener("input",function(e){
 if(e.target.id!=="q-text")return;S.f.q=e.target.value;renderResults();
});

function loadScript(src){return new Promise(function(ok,no){var s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=function(){no(new Error("필요한 모듈을 불러오지 못했습니다."))};document.head.appendChild(s)})}
async function startFirebase(){
 if(location.protocol==="file:"){render();return}
 S.loading=true;render();
 try{
  if(!window.firebase){var base="https://www.gstatic.com/firebasejs/"+FB_VER+"/firebase-";
   await loadScript(base+"app-compat.js");await loadScript(base+"auth-compat.js");await loadScript(base+"firestore-compat.js")}
  if(!firebase.apps.length)firebase.initializeApp(FBC);
  fauth=firebase.auth();fdb=firebase.firestore();
  fauth.onAuthStateChanged(function(u){fbAuthChanged(u)});
 }catch(e){S.loading=false;S.gateErr="Firebase에 연결하지 못했습니다. "+e.message;render()}
}
async function start(){
 loadGmaps();
 if(FB){await startFirebase();return}
 if(!REAL){S.user=load(KEY_U);if(S.user)await loadRecords();else render();return}
 S.loading=true;render();
 try{
  if(!window.msal)await loadScript(CFG.msalScriptUrl||"https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js");
  msalApp=new msal.PublicClientApplication({auth:{clientId:CFG.msClientId,authority:"https://login.microsoftonline.com/"+CFG.msTenantId,redirectUri:CFG.redirectUri||(location.origin+location.pathname)},cache:{cacheLocation:"sessionStorage"}});
  await msalApp.handleRedirectPromise();
  var acc=msalApp.getAllAccounts()[0];
  if(!acc){S.loading=false;render();return}
  var me=await graph("/me?$select=displayName,department");
  S.user={name:me.displayName||acc.name||acc.username,team:me.department||"소속 미등록"};
  await loadRecords();
 }catch(e){S.loading=false;S.gateErr="로그인 준비 중 문제가 생겼습니다. "+e.message;render()}
}
start();
})();
</script>
